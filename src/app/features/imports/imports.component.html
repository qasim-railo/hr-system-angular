<section class="page-shell"><header class="page-heading"><div><p class="eyebrow">Data migration</p><h1>Import center</h1><p class="subtitle">Preview, validate, and import employee or department CSV/Excel data.</p></div></header><div class="card"><label>Entity <select [(ngModel)]="entityType"><option>Employee</option><option>Department</option></select></label><input type="file" accept=".csv,.xlsx" (change)="choose($event)"><button type="button" (click)="preview()">Upload and preview</button></div><div class="alert error" *ngIf="error">{{ error }}</div><div class="card table-responsive"><table class="table"><thead><tr><th>File</th><th>Entity</th><th>Status</th><th>Rows</th><th>Errors</th><th>Action</th></tr></thead><tbody><tr *ngFor="let job of jobs"><td>{{ job.fileName }}</td><td>{{ job.entityType }}</td><td>{{ job.status }}</td><td>{{ job.validRows }}/{{ job.totalRows }}</td><td>{{ job.errorRows }}</td><td><button type="button" *ngIf="job.status === 'Ready' || job.status === 'Validation errors'" (click)="execute(job)">Import valid rows</button></td></tr></tbody></table><p *ngIf="!jobs.length && !error">No import jobs yet.</p></div></section>
