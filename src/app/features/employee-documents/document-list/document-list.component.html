<mat-card>
    <h3 class="mb-3">📄 Uploaded Documents</h3>
    <div class="d-flex gap-2 mb-3">
        <mat-form-field appearance="outline" class="flex-grow-1">
            <mat-label>Search file metadata</mat-label>
            <input matInput [(ngModel)]="search" (keyup.enter)="applySearch()">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Document type</mat-label>
            <input matInput [(ngModel)]="documentType" (keyup.enter)="applySearch()">
        </mat-form-field>
        <button mat-raised-button color="primary" type="button" (click)="applySearch()">Search</button>
    </div>

    <table mat-table [dataSource]="documents" class="mat-elevation-z8 w-100">

        <!-- File Name Column -->
        <ng-container matColumnDef="fileName">
            <th mat-header-cell *matHeaderCellDef>File Name</th>
            <td mat-cell *matCellDef="let doc">{{ doc.originalFileName }}</td>
        </ng-container>

        <!-- File Type Column -->
        <ng-container matColumnDef="fileType">
            <th mat-header-cell *matHeaderCellDef>Type</th>
            <td mat-cell *matCellDef="let doc">{{ doc.documentType }} · {{ doc.mimeType }}</td>
        </ng-container>

        <!-- Uploaded At Column -->
        <ng-container matColumnDef="uploadedAt">
            <th mat-header-cell *matHeaderCellDef>Uploaded</th>
            <td mat-cell *matCellDef="let doc">{{ doc.uploadedAt | date: 'short' }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let doc">
                <!-- <button mat-icon-button color="primary" (click)="download(doc.id)">
                    <mat-icon>download</mat-icon>
                </button> -->
                <button mat-icon-button color="primary" (click)="download(doc.id)" aria-label="Download document">
                    <mat-icon>download</mat-icon>
                </button>

                <button mat-icon-button color="warn" (click)="delete(doc.fileId)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div *ngIf="documents.length === 0" class="text-center text-muted mt-5">
        No documents uploaded yet.
    </div>
</mat-card>
