<div class="login-shell">
  <div class="login-aside">
    <div class="login-brand"><span class="brand-mark"><span class="material-symbols-rounded">hub</span></span><strong>PeopleOS</strong></div>
    <div class="login-message"><span class="material-symbols-rounded">groups</span><h1>Make people work<br><em>better together.</em></h1><p>A calmer workspace for the details that keep your organization moving.</p></div>
  </div>
  <div class="login-panel">
  <div class="card login-card p-4">
    <div class="text-center mb-4">
      <span class="material-symbols-rounded login-icon">lock_open</span>
      <h2 class="fw-bold">Welcome back</h2>
      <p class="text-muted">Sign in to your workspace</p>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input
          id="username"
          type="text"
          class="form-control"
          formControlName="username"
          [class.is-invalid]="submitted && loginForm.controls.username.invalid"
        />
        <div *ngIf="submitted && loginForm.controls.username.invalid" class="invalid-feedback">
          Username is required
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          [class.is-invalid]="submitted && loginForm.controls.password.invalid"
        />
        <div *ngIf="submitted && loginForm.controls.password.invalid" class="invalid-feedback">
          Password is required
        </div>
      </div>

      <div class="d-grid">
        <button class="btn btn-primary" type="submit">
          <span class="material-symbols-rounded">login</span> Sign in
        </button>
      </div>
    </form>
  </div>
  </div>
</div>
